name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repair-n8n-main-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and validate n8n main workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import uuid

          source = Path('n8n/WeRSS_Dify_知识库自动化主工作流_v6_15篇批量部分成功续跑完整版.json')
          repo_out = Path('n8n')
          artifact_out = Path('repaired-n8n-workflow')
          artifact_out.mkdir(exist_ok=True)

          import_name = 'WeRSS_Dify_知识库自动化主工作流_v7_n8n导入修复版.json'
          canvas_name = 'WeRSS_Dify_知识库自动化主工作流_v7_画布直接粘贴版.json'
          report_name = 'WeRSS_Dify_知识库自动化主工作流_v7_校验报告.txt'

          raw = source.read_text(encoding='utf-8-sig')
          invalid_single_quote_escapes = raw.count("\\'")
          raw = raw.replace("\\'", "'")
          workflow = json.loads(raw)

          if not isinstance(workflow, dict):
              raise ValueError('Workflow root must be an object')
          nodes = workflow.get('nodes')
          connections = workflow.get('connections')
          if not isinstance(nodes, list):
              raise ValueError('Workflow nodes must be an array')
          if not isinstance(connections, dict):
              raise ValueError('Workflow connections must be an object')

          names = [str(node.get('name', '')).strip() for node in nodes]
          if any(not name for name in names):
              raise ValueError('Every node must have a non-empty name')
          if len(names) != len(set(names)):
              duplicates = sorted({name for name in names if names.count(name) > 1})
              raise ValueError(f'Duplicate node names: {duplicates}')

          name_set = set(names)
          graph_errors = []
          for source_name, connection_types in connections.items():
              if source_name not in name_set:
                  graph_errors.append(f'missing source: {source_name}')
              if not isinstance(connection_types, dict):
                  continue
              for outputs in connection_types.values():
                  if not isinstance(outputs, list):
                      continue
                  for output_group in outputs:
                      if not isinstance(output_group, list):
                          continue
                      for edge in output_group:
                          if isinstance(edge, dict) and edge.get('node') not in name_set:
                              graph_errors.append(f"missing target: {edge.get('node')}")
          if graph_errors:
              raise ValueError('; '.join(graph_errors))

          allowed_on_error = {'stopWorkflow', 'continueRegularOutput', 'continueErrorOutput'}
          normalized_ids = 0
          capped_retry_waits = 0

          for index, node in enumerate(nodes, start=1):
              node_name = str(node['name'])
              node_id = str(uuid.uuid5(uuid.NAMESPACE_URL, f'aiyx-n8n-main-v7:{index}:{node_name}'))
              if node.get('id') != node_id:
                  normalized_ids += 1
              node['id'] = node_id

              if not (isinstance(node.get('position'), list) and len(node['position']) == 2):
                  node['position'] = [index * 240, 0]

              if 'maxTries' in node:
                  try:
                      node['maxTries'] = min(5, max(2, int(node['maxTries'])))
                  except Exception:
                      node.pop('maxTries', None)

              if 'waitBetweenTries' in node:
                  try:
                      original = int(node['waitBetweenTries'])
                      normalized = min(5000, max(0, original))
                      if original != normalized:
                          capped_retry_waits += 1
                      node['waitBetweenTries'] = normalized
                  except Exception:
                      node.pop('waitBetweenTries', None)

              if node.get('onError') not in allowed_on_error:
                  node.pop('onError', None)

          import_workflow = {
              'name': 'WeRSS Dify 知识库自动化主工作流 v7 - 15篇批量部分成功续跑导入修复版',
              'nodes': nodes,
              'connections': connections,
              'settings': {'executionOrder': 'v1'},
              'pinData': {},
          }
          canvas_workflow = {
              'nodes': nodes,
              'connections': connections,
              'pinData': {},
          }

          import_text = json.dumps(import_workflow, ensure_ascii=False, indent=2) + '\n'
          canvas_text = json.dumps(canvas_workflow, ensure_ascii=False, separators=(',', ':')) + '\n'

          parsed_import = json.loads(import_text)
          parsed_canvas = json.loads(canvas_text)
          for parsed, label in ((parsed_import, 'import'), (parsed_canvas, 'canvas')):
              if len(parsed['nodes']) != len(nodes):
                  raise ValueError(f'{label}: node count changed')
              ids = [node['id'] for node in parsed['nodes']]
              if len(ids) != len(set(ids)):
                  raise ValueError(f'{label}: duplicate node IDs')
              for node_id in ids:
                  uuid.UUID(node_id)

          report = [
              'JSON_PARSE=PASS',
              'N8N_IMPORT_STRUCTURE=PASS',
              'CANVAS_CLIPBOARD_STRUCTURE=PASS',
              f'INVALID_SINGLE_QUOTE_ESCAPES_REPAIRED={invalid_single_quote_escapes}',
              f'NODE_COUNT={len(nodes)}',
              f'CONNECTION_SOURCE_COUNT={len(connections)}',
              f'UNIQUE_NODE_NAMES={len(set(names))}',
              f'UUID_NODE_IDS={len(nodes)}',
              f'NORMALIZED_NODE_IDS={normalized_ids}',
              f'CAPPED_RETRY_WAITS={capped_retry_waits}',
              'ENCODING=UTF-8_WITHOUT_BOM',
              'TOP_LEVEL_CUSTOM_META=REMOVED',
              'TOP_LEVEL_ACTIVE=REMOVED',
          ]
          report_text = '\n'.join(report) + '\n'

          for directory in (repo_out, artifact_out):
              (directory / import_name).write_text(import_text, encoding='utf-8', newline='\n')
              (directory / canvas_name).write_text(canvas_text, encoding='utf-8', newline='\n')
              (directory / report_name).write_text(report_text, encoding='utf-8', newline='\n')

          print(report_text)
          PY

      - name: Commit repaired workflow files on branch push
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'n8n/WeRSS_Dify_知识库自动化主工作流_v7_n8n导入修复版.json' \
            'n8n/WeRSS_Dify_知识库自动化主工作流_v7_画布直接粘贴版.json' \
            'n8n/WeRSS_Dify_知识库自动化主工作流_v7_校验报告.txt'
          if git diff --cached --quiet; then
            echo "No repaired workflow changes to commit"
          else
            git commit -m "fix(n8n): add validated v7 import and canvas workflow files"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload repaired workflow files
        uses: actions/upload-artifact@v4
        with:
          name: repaired-n8n-main-workflow-v7
          path: repaired-n8n-workflow/
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
